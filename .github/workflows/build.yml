name: Build and zip

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one build per ref at a time; queue the rest so we don't fight over the version.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

# Needed so we can commit the version bump back to main.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION="$(jq -r '.version' manifest.json)"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not read version from manifest.json" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Zip extension
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OUT="preface-scheduler-v${VERSION}.zip"
          zip -r "$OUT" . \
            -x '.git/*' \
               '.github/*' \
               '.gitignore' \
               '*.zip' \
            >/dev/null
          # Sanity-check that the manifest and at least one source file made it in.
          unzip -l "$OUT" | grep -E '(manifest\.json|src/content\.js|icons/icon128\.png)' >&2
          echo "Created $OUT"
          ls -la "$OUT"
          # Mirror under a stable filename for the GitHub Release asset, so
          # /releases/latest/download/preface-scheduler.zip stays a valid
          # link regardless of the version that was just shipped.
          cp "$OUT" "preface-scheduler.zip"
          echo "Created preface-scheduler.zip (stable mirror for release)"

      - name: Bump patch version (push only)
        if: github.event_name == 'push'
        run: |
          CURRENT="${{ steps.version.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          jq --arg v "$NEW_VERSION" '.version = $v' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json
          echo "Bumped $CURRENT -> $NEW_VERSION"

      - name: Commit version bump (push only)
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore(release): bump version to $(jq -r '.version' manifest.json)"
          git push origin HEAD:main

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: preface-scheduler-v${{ steps.version.outputs.version }}
          path: preface-scheduler-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Preface Scheduler v${{ steps.version.outputs.version }}"
          body: |
            Auto-built by the **Build and zip** workflow.

            - Manifest version: `${{ steps.version.outputs.version }}`
            - Trigger: `${{ github.event_name }}`
            - Commit: `${{ github.sha }}`
          files: preface-scheduler.zip
          # Fail loudly if the stable-name zip is missing - a release
          # without an asset would break the /releases/latest link.
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
